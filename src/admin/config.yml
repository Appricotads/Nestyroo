backend:
  name: git-gateway
  branch: main

# Where uploaded images get stored, and the URL path used to reference them
media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false, hint: "Describe the image for accessibility and SEO" }
      - { label: "Description (shown in listings)", name: "description", widget: "text" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - label: "Category"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Pregnancy & newborn", value: "pregnancy-newborn" }
          - { label: "Baby Gear & Nursery", value: "baby-gear-nursery" }
          - { label: "Toddlers & Kids", value: "toddlers-kids" }
          - { label: "Savings Tips", value: "savings-tips" }
          - { label: "Sales Calendar", value: "sales-calendar" }
      - { label: "Body", name: "body", widget: "markdown" }
